name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: module
    attributes: {label: Module and version, placeholder: "magebooster/module-moka 1.0.0"}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Magento / PHP version, placeholder: "Magento 2.4.8-p3, PHP 8.3"}
    validations: {required: true}
  - type: dropdown
    id: theme
    attributes: {label: Theme, options: [Luma, Hyvä, Other]}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce and expected result}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Relevant log lines, description: "var/log/exception.log, system.log. Remove keys and personal data.", render: text}
